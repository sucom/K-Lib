<form name="frmAddEditMember" id="frmAddEditMember"
      method="POST" action="" onsubmit="return(false);">
  <div class="row-fluid">
    <div class="span10 text-center"><h2>Add/Edit</h2></div>
    <div class="span2"><a href="#closeMemberDetailsView" onclick="closeMemberDetailsEdit();">Close</a></div>
  </div>

  <div class="row-fluid">
    <span class="span2">Name</span>
    <span class="span10"><input name="name" id="editMemberName" type="text" value="{{ name }}" data-disable-keys="9,+Shift" data-focus-next='#editMemberCompany' data-focus-back='#editMemberAddrZip'/></span>
  </div>
  <div class="row-fluid">
    <span class="span2">Active</span>
    <span class="span10">
      <input name="_isActive" id="editMemberStatus" type="checkbox" value="true"/>
    </span>
  </div>
  <div class="row-fluid">
    <span class="span2">Gender</span>
    <span class="span10">
      <label class="radio inline"><input name="gender" id="editMemberGenderMale" type="radio" value="male" checked/> Male</label>
      <label class="radio inline"><input name="gender" id="editMemberGenderFemale" type="radio" value="female"/> Female</label>
    </span>
  </div>
  <div class="row-fluid">
    <span class="span2">Company</span>
    <span class="span10"><input name="company" id="editMemberCompany" type="text" value="{{{company}}}" /></span>
  </div>
  <div class="row-fluid">
    <span class="span2">eMail</span>
    <span class="span10"><input name="email" id="editMemberEmail" type="text" value="{{email}}" /></span>
  </div>
  <div class="row-fluid">
    <span class="span2">Phone</span>
    <span class="span10"><input name="phone" id="editMemberPhone" type="text" value="{{ phone }}" /></span>
  </div>
  <div class="row-fluid">
    <div class="span2">Address</div>
    <div class="span10">
      <div class="row-fluid">
        <span class="span2">Street</span>
        <span class="span10"><input name="addressStreet" id="editMemberAddrStreet" type="text" value="{{ address.street }}" /></span>
      </div>
      <div class="row-fluid">
        <span class="span2">City</span>
        <span class="span10"><input name="addressCity" id="editMemberAddrCity" type="text" value="{{ address.city }}" /></span>
      </div>
      <div class="row-fluid">
        <span class="span2">State</span>
        <span class="span10"><input name="addressState" id="editMemberAddrState" type="text" value="{{ address.state }}" /></span>
      </div>
      <div class="row-fluid">
        <span class="span2">Country</span>
        <span class="span10">
          <select name="addressCountry" id="editMemberAddrCountry">
            <option value="">{{ address.country }}</option>
          </select>
        </span>
      </div>
      <div class="row-fluid">
        <span class="span2">ZIP</span>
        <span class="span10"><input name="address.zip" id="editMemberAddrZip" type="text" value="{{ address.zip }}" /></span>
      </div>
    </div>
  </div>
  <div class="row-fluid">
    <div class="span6 offset6 text-right">
      <div class="btn btn-small btn-primary" onclick="appFFM.ViewActions.saveMemberData();">Save</div>
      <input type='button' value='Cancel' class="btn btn-small btn-inverse" data-focus-next='#editMemberName' onclick="closeMemberDetailsEdit();"/>
    </div>
  </div>
</form>
