<div class="row-fluid">
  <div class="span10 text-center"><h2>View</h2></div>
  <div class="span2"><a href="#closeMemberDetailsView" onclick="closeMemberDetailsView();">Close</a></div> <!-- -->
</div>
<div class="row-fluid">
  <span class="span2">Name</span>
  <span class="span10">{{name}}</span>
</div>
<div class="row-fluid">
  <span class="span2">Active</span>
  <span class="span10">{{isActive}}</span>
</div>
<div class="row-fluid">
  <span class="span2">Gender</span>
  <span class="span10">{{gender}}</span>
</div>
<div class="row-fluid">
  <span class="span2">Company</span>
  <span class="span10">{{company}}</span>
</div>
<div class="row-fluid">
  <span class="span2">eMail</span>
  <span class="span10">{{email}}</span>
</div>
<div class="row-fluid">
  <span class="span2">Phone</span>
  <span class="span10">{{phone}}</span>
</div>
<div class="row-fluid">
  <div class="span2">Address</div>
  <div class="span10">
    <div>{{address.street}}</div>
    <div>{{address.city}}</div>
    <div>{{address.state}}</div>
    <div>{{address.country}}</div>
    <div>{{address.zip}}</div>
  </div>
</div>
